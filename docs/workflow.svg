<svg xmlns="http://www.w3.org/2005/SVG" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradWarning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gradDanger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">RESEARCH ABSTRACT EVALUATOR - 5-STAGE PIPELINE</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">University Mini Project • Course: AI Tools &amp; Prompt Engineering • Computer Science &amp; AI Papers</text>

  <!-- Input Sources Block -->
  <g filter="url(#shadow)">
    <rect x="50" y="105" width="260" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="132" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">INPUT CHANNELS (A, B, C)</text>
    
    <rect x="70" y="145" width="220" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="80" y="164" fill="#cbd5e1" font-size="12">📝 A. Paste &amp; Live Word Counter</text>
    
    <rect x="70" y="180" width="220" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="80" y="199" fill="#cbd5e1" font-size="12">🔍 B. OpenAlex / arXiv Import</text>
    
    <rect x="70" y="215" width="220" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="80" y="234" fill="#cbd5e1" font-size="12">📁 C. PDF / TXT Upload (pypdf)</text>
  </g>

  <!-- Arrow Input -> Stage 1 -->
  <line x1="310" y1="180" x2="370" y2="180" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 1: Pre-Check -->
  <g filter="url(#shadow)">
    <rect x="375" y="105" width="250" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="375" y="105" width="250" height="34" rx="12" fill="url(#gradPrimary)"/>
    <text x="500" y="128" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STAGE 1: PRE-CHECK (NO LLM)</text>
    
    <text x="390" y="162" fill="#e2e8f0" font-size="11.5">• Length Check: 40 &le; words &le; 450</text>
    <text x="390" y="182" fill="#e2e8f0" font-size="11.5">• Prose Validation (Symbols &le; 35%)</text>
    <text x="390" y="202" fill="#e2e8f0" font-size="11.5">• Repetition &amp; Gibberish Filtering</text>
    <text x="390" y="222" fill="#f87171" font-size="11.5" font-weight="600">• Prompt Injection Scanner</text>
    <text x="390" y="240" fill="#94a3b8" font-size="10.5">Rejects invalid input (0 API tokens used)</text>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="625" y1="180" x2="685" y2="180" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 2: LLM Scoring -->
  <g filter="url(#shadow)">
    <rect x="690" y="105" width="260" height="150" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="690" y="105" width="260" height="34" rx="12" fill="url(#gradPurple)"/>
    <text x="820" y="128" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STAGE 2: LLM SCORING</text>
    
    <text x="705" y="162" fill="#e2e8f0" font-size="11.5">• Prompt Versions: v1 / v2 / v3</text>
    <text x="705" y="182" fill="#e2e8f0" font-size="11.5">• 5 Items &times; 0–4 (Purpose, Method,</text>
    <text x="715" y="198" fill="#e2e8f0" font-size="11.5">Results, Conclusion, Clarity)</text>
    <text x="705" y="220" fill="#cbd5e1" font-size="11.5">• Verbatim Evidence Quotes</text>
    <text x="705" y="240" fill="#a78bfa" font-size="10.5">Engines: Anthropic / OpenAI / Gemini / MOCK</text>
  </g>

  <!-- Arrow Stage 2 down to Stage 4 -->
  <path d="M 820 255 L 820 300 L 500 300 L 500 335" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Code Validation -->
  <g filter="url(#shadow)">
    <rect x="360" y="340" width="280" height="140" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="360" y="340" width="280" height="34" rx="12" fill="url(#gradWarning)"/>
    <text x="500" y="363" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STAGE 4: VALIDATION (CODE GUARDS)</text>
    
    <text x="375" y="398" fill="#e2e8f0" font-size="11.5">• Strips ```json Markdown Fences</text>
    <text x="375" y="418" fill="#e2e8f0" font-size="11.5">• Checks Bounds [0–4] for All 5 Items</text>
    <text x="375" y="438" fill="#fde68a" font-size="11.5" font-weight="700">• Python Recomputes Total (Ignores LLM)</text>
    <text x="375" y="458" fill="#e2e8f0" font-size="11.5">• Substring Evidence Verification (Anti-Hallucination)</text>
  </g>

  <!-- Arrow Stage 4 -> Stage 3 (Suggestions) -->
  <line x1="360" y1="410" x2="300" y2="410" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Suggestions -->
  <g filter="url(#shadow)">
    <rect x="50" y="340" width="250" height="140" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="365" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">STAGE 3: SUGGESTIONS</text>
    <text x="65" y="395" fill="#e2e8f0" font-size="11.5">• Triggered if score &le; 2 / 4</text>
    <text x="65" y="415" fill="#e2e8f0" font-size="11.5">• Max 5 Actionable Fixes</text>
    <text x="65" y="435" fill="#f87171" font-size="11.5" font-weight="600">• NO Invented Numbers</text>
    <text x="65" y="455" fill="#94a3b8" font-size="10.5">Template sentences for student viva</text>
  </g>

  <!-- Arrow Stage 4 -> Stage 5 (Storage & Automation) -->
  <line x1="640" y1="410" x2="700" y2="410" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Storage & Automation -->
  <g filter="url(#shadow)">
    <rect x="705" y="330" width="255" height="160" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="705" y="330" width="255" height="34" rx="12" fill="url(#gradSuccess)"/>
    <text x="832" y="353" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STAGE 5: STORAGE &amp; AUTOMATION</text>
    
    <text x="720" y="388" fill="#e2e8f0" font-size="11.5">• Excel (results.xlsx) Thread Lock</text>
    <text x="720" y="408" fill="#e2e8f0" font-size="11.5">• Sheets: evaluations, automation_log,</text>
    <text x="730" y="424" fill="#e2e8f0" font-size="11.5">and flagged_low_scores</text>
    <text x="720" y="448" fill="#6ee7b7" font-size="11.5" font-weight="700">• Trigger: Total &le; 10 / 20</text>
    <text x="720" y="468" fill="#cbd5e1" font-size="11.0">Actions: Webhook + SMTP Email</text>
  </g>

  <!-- Output / UI Block -->
  <g filter="url(#shadow)">
    <rect x="250" y="530" width="500" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="560" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="800">INTERACTIVE WEB UI REPORT CARD &amp; AUDIT TRAIL</text>
    <text x="500" y="585" text-anchor="middle" fill="#e2e8f0" font-size="12">Big Score "x / 20" • Coloured Level Bars • Evidence Quote Ticks / Hallucination Warnings</text>
    <text x="500" y="605" text-anchor="middle" fill="#e2e8f0" font-size="12">Injection Warning Banner • Automation Status • Download Excel (/download)</text>
    <text x="500" y="625" text-anchor="middle" fill="#94a3b8" font-size="11">Light / Dark Theme • Responsive Vanilla JS &amp; CSS (No Build Step)</text>
  </g>

  <!-- Arrow from Stage 3 down to UI -->
  <path d="M 175 480 L 175 585 L 245 585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow from Stage 5 down to UI -->
  <path d="M 832 490 L 832 585 L 755 585" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>
